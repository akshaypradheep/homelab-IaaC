---
# install-jellyfin.yml
#
# Manual entry point for roles/jellyfin — the same logic runs
# automatically as part of site.yml (and therefore `make apply`) for any
# host with `install_jellyfin: true` in its host_vars, see
# docs/ansible-layout.md.
#
# Usage:
#   make ansible-run PLAYBOOK=install-jellyfin LIMIT=jellyfin-01
- name: Install Jellyfin
  hosts: all_servers
  become: true
  roles:
    - jellyfin
