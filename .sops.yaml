# SOPS config: which files get encrypted with which age recipient.
# Run scripts/age-keygen.sh once to generate keys/age.key, then replace the
# placeholder recipient below with the public key it prints (age1...).
creation_rules:
  - path_regex: .*\.sops\.ya?ml$
    age: age1wmwxhp06mjmzjnju8nf2yx23re04lyh840w9w275q383sfmhju9smycrjv