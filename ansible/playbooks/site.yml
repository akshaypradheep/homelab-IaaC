---
# Applies to every host, every time. `make provision-env ENV=<type>` runs
# this same playbook with --limit env_<type> — there is no separate
# per-type playbook to keep in sync.
- name: Provision homelab servers
  hosts: all_servers
  become: true
  roles:
    - common
    - packages
    - docker
    # OpenMediaVault: opt-in per host via `install_openmediavault: true`
    # in host_vars. Idempotent — skips once already installed.
    - role: openmediavault
      when: install_openmediavault | default(false)
    # USB kernel fix: opt-in per host via `fix_usb_kernel: true` in
    # host_vars — independent of usb_mounts below, so you can prep a host
    # for USB passthrough (or just want lsusb/usbutils-friendly drivers)
    # without also mounting anything. Idempotent — no-ops once already on
    # the standard kernel, so it's safe to run on every apply.
    - role: usb-kernel-fix
      when: fix_usb_kernel | default(false)
    # Drive mounts: automatic for any host with usb_mounts declared in
    # its host_vars (see open-media-vault.yml). Idempotent — self-skips
    # when the list is empty.
    - role: usb-mounts
      when: (usb_mounts | default([])) | length > 0
    # Webmin: opt-in per host via `install_webmin: true` in host_vars.
    - role: webmin
      when: install_webmin | default(false)
    # Per-server-type roles go here, gated by group, e.g.:
    # - role: monitoring-agent
    #   when: "'env_prod' in group_names"
