---
# Pushes ONE stack (compose/<stack>/docker-compose.yml) to whichever hosts
# opt into it. A host opts in by listing the stack name in its
# `compose_stacks` var (host_vars or group_vars) — this keeps "which stack
# runs where" declared in inventory data, not hardcoded in this playbook.
#
# Usage: make compose-deploy STACK=example-stack
#        (wraps: ansible-playbook playbooks/deploy-compose.yml -e stack=example-stack)
- name: Deploy a Docker Compose stack
  hosts: docker_hosts
  become: true
  tasks:
    - name: Fail fast if no stack was named
      ansible.builtin.assert:
        that: stack is defined
        fail_msg: "Pass -e stack=<name> (or use `make compose-deploy STACK=<name>`)."
      run_once: true

    - name: Skip hosts that don't opt into this stack
      ansible.builtin.meta: end_host
      # default([]) here (not a play-level `vars:`) because play vars would
      # outrank host_vars/group_vars in Ansible's precedence order and
      # silently override every host's real compose_stacks with this
      # fallback — which is exactly what happened here before this fix.
      when: stack not in (compose_stacks | default([]))

    - name: Ensure the stack's directory exists on the host
      ansible.builtin.file:
        path: "{{ docker_compose_root }}/{{ stack }}"
        state: directory
        mode: "0755"

    - name: Push the stack's files (compose file + any supporting config)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../compose/{{ stack }}/"
        dest: "{{ docker_compose_root }}/{{ stack }}/"
        # World-readable, not just owner/group: these files (prometheus.yml,
        # grafana provisioning, ...) get bind-mounted read-only into
        # containers that often run as an arbitrary non-root UID (e.g.
        # prom/prometheus's "nobody"), which has no reason to be in the
        # host-side owning group. Verified live: 0640 caused Prometheus to
        # crash-loop on "permission denied" reading its own config.
        mode: "0644"
        directory_mode: "0755"

    - name: Check for a secrets template for this stack
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../compose/{{ stack }}/.env.j2"
      delegate_to: localhost
      become: false
      register: env_template

    - name: Render stack secrets to .env (read live from secrets.sops.yaml, never committed)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../compose/{{ stack }}/.env.j2"
        dest: "{{ docker_compose_root }}/{{ stack }}/.env"
        mode: "0600"
      when: env_template.stat.exists

    - name: Remove the unrendered .env.j2 copy (compose would ignore it, but no reason to leave it)
      ansible.builtin.file:
        path: "{{ docker_compose_root }}/{{ stack }}/.env.j2"
        state: absent
      when: env_template.stat.exists

    - name: Bring the stack up
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_root }}/{{ stack }}"
        state: present
