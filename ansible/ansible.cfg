[defaults]
# Both files are loaded and merged: hosts.generated.yml (Terraform-owned,
# gitignored) plus hosts.static.yml (hand-maintained, for anything not
# provisioned by this Terraform — a NAS, a router, a box you SSH'd into
# once and configured by hand).
inventory      = inventory/hosts.generated.yml,inventory/hosts.static.yml
remote_user    = apj
# Verified against ssh_known_hosts (below), not skipped outright — see
# scripts/trust-host-keys.sh for how that file gets populated/refreshed.
host_key_checking = True
interpreter_python = auto_silent
roles_path     = roles
deprecation_warnings = False

[ssh_connection]
pipelining = True
# Dedicated, repo-scoped known_hosts (scripts/trust-host-keys.sh, run by
# `make apply` before provisioning) instead of the operator's personal
# ~/.ssh/known_hosts — self-contained and reproducible across machines.
ssh_args = -o UserKnownHostsFile=./ssh_known_hosts
