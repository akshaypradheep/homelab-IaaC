[defaults]
# Both files are loaded and merged: hosts.generated.yml (Terraform-owned,
# gitignored) plus hosts.static.yml (hand-maintained, for anything not
# provisioned by this Terraform — a NAS, a router, a box you SSH'd into
# once and configured by hand).
inventory      = inventory/hosts.generated.yml,inventory/hosts.static.yml
remote_user    = ansible
host_key_checking = False
interpreter_python = auto_silent
roles_path     = roles

[ssh_connection]
pipelining = True
