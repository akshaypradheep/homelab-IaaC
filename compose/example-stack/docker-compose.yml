# Minimal placeholder stack demonstrating the layout — replace with a real
# service. Deployed via: make compose-deploy STACK=example-stack
# Image tag pinned deliberately — see compose/monitoring/docker-compose.yml
# for why.
services:
  whoami:
    image: traefik/whoami:v1.10.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.1
    ports:
      - "8080:80"
