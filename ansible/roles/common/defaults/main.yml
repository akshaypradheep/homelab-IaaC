common_ssh_password_auth: false
# UTC, not a specific region — this is the role's fallback for a generic
# boilerplate; group_vars/all.yml already overrides it, but the fallback
# itself should be neutral too.
common_timezone: "UTC"
common_auto_reboot: false
# Same override pattern as common_ssh_password_auth — a single point to
# flip if a future type ever genuinely needs it, defaulting to the hardened
# choice. See roles/common/tasks/main.yml.
common_permit_root_login: false
