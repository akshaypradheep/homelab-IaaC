---
# fix-usb-cloud-kernel.yml
#
# Problem: Debian's linux-image-*-cloud-amd64 kernel flavor ships without
# USB host-controller drivers (xhci_pci, xhci_hcd, etc.), so USB passthrough
# to a Proxmox VM silently fails at the guest kernel level even though the
# host and QEMU config are correct.
#
# Fix: install the standard (non-cloud) kernel, remove the cloud kernel
# packages so GRUB has nothing else to default to, regenerate GRUB, and
# reboot. cloud-init is unaffected — it's a separate boot service and does
# not depend on which kernel flavor is running.
#
# Disruptive (swaps kernels, reboots the host) and rare — not part of
# `make apply`, run by hand only, always scoped with --limit. See
# docs/commands.md for how to target one host / several / everything.
#
# Usage:
#   make fix-usb-kernel LIMIT=open-media-vault
#   (or directly: cd ansible && ansible-playbook playbooks/fix-usb-cloud-kernel.yml --limit open-media-vault)
- name: Fix missing USB (xhci) drivers by switching off the Debian cloud kernel
  hosts: all_servers
  become: true
  vars:
    # Set to false to only install the standard kernel without removing
    # the cloud kernel packages (leaves GRUB default selection manual).
    remove_cloud_kernel: true

  tasks:
    - name: Ensure this is a Debian/cloud-kernel host before doing anything
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Report current running kernel
      ansible.builtin.debug:
        msg: "Current kernel on {{ inventory_hostname }}: {{ current_kernel.stdout }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install the standard (non-cloud) kernel image
      ansible.builtin.apt:
        name: linux-image-amd64
        state: present

    - name: Find installed cloud kernel packages
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | awk '/^ii/ && /linux-image.*cloud/ {print $2}'
      args:
        executable: /bin/bash
      register: cloud_kernel_pkgs
      changed_when: false

    - name: Remove cloud kernel packages (forces GRUB to default to the standard kernel)
      ansible.builtin.apt:
        name: "{{ cloud_kernel_pkgs.stdout_lines }}"
        state: absent
        purge: false
      when:
        - remove_cloud_kernel | bool
        - cloud_kernel_pkgs.stdout_lines | length > 0

    - name: Regenerate GRUB configuration
      ansible.builtin.command: update-grub
      changed_when: true

    - name: Reboot the host to boot into the standard kernel
      ansible.builtin.reboot:
        msg: "Rebooting to switch from cloud kernel to standard kernel for USB passthrough"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 10
        test_command: uptime

    - name: Verify the running kernel is no longer the cloud flavor
      ansible.builtin.command: uname -r
      register: new_kernel
      changed_when: false
      failed_when: "'cloud' in new_kernel.stdout"

    - name: Report new running kernel
      ansible.builtin.debug:
        msg: "Now running kernel: {{ new_kernel.stdout }}"

    - name: Ensure xhci_pci module is loaded
      ansible.builtin.command: modprobe xhci_pci
      changed_when: false

    - name: Install usbutils (provides lsusb)
      ansible.builtin.apt:
        name: usbutils
        state: present

    - name: Check lsusb output for verification
      ansible.builtin.command: lsusb
      register: lsusb_out
      changed_when: false
      failed_when: false

    - name: Show detected USB devices
      ansible.builtin.debug:
        msg: "{{ lsusb_out.stdout_lines }}"
