---
# Pushes ONE stack (compose/<stack>/docker-compose.yml) to whichever hosts
# opt into it. A host opts in via the 3-layer union below — same pattern
# as roles/packages (common_packages + type_packages + host_packages):
#   common_compose_stacks <- group_vars/all.yml            (every host)
#   type_compose_stacks   <- group_vars/env_<type>.yml      (per env_<type> group)
#   host_compose_stacks   <- host_vars/<hostname>.yml       (per host)
# This keeps "which stack runs where" declared in inventory data, not
# hardcoded in this playbook.
#
# Usage: make compose-deploy STACK=example-stack
#        (wraps: ansible-playbook playbooks/deploy-compose.yml -e stack=example-stack)
- name: Deploy a Docker Compose stack
  hosts: docker_hosts
  become: true
  tasks:
    - name: Fail fast if no stack was named
      ansible.builtin.assert:
        that: stack is defined
        fail_msg: "Pass -e stack=<name> (or use `make compose-deploy STACK=<name>`)."
      run_once: true

    - name: Compute this host's full compose_stacks set
      # `| default([])` guards any layer a given host/type doesn't define.
      # Deliberately a set_fact, not a play-level `vars:` — play vars would
      # outrank host_vars/group_vars in Ansible's precedence order and
      # silently override every host's real opt-in list with whatever's
      # here, which is exactly what happened here before this pattern.
      ansible.builtin.set_fact:
        compose_stacks_all_layers: >-
          {{ (common_compose_stacks | default([]))
             | union(type_compose_stacks | default([]))
             | union(host_compose_stacks | default([])) }}

    - name: Skip hosts that don't opt into this stack
      ansible.builtin.meta: end_host
      when: stack not in compose_stacks_all_layers

    - name: Ensure the stack's directory exists on the host
      ansible.builtin.file:
        path: "{{ docker_compose_root }}/{{ stack }}"
        state: directory
        mode: "0755"

    - name: Push the stack's files (compose file + any supporting config)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../compose/{{ stack }}/"
        dest: "{{ docker_compose_root }}/{{ stack }}/"
        # World-readable, not just owner/group: these files (prometheus.yml,
        # grafana provisioning, ...) get bind-mounted read-only into
        # containers that often run as an arbitrary non-root UID (e.g.
        # prom/prometheus's "nobody"), which has no reason to be in the
        # host-side owning group. Verified live: 0640 caused Prometheus to
        # crash-loop on "permission denied" reading its own config.
        mode: "0644"
        directory_mode: "0755"
      register: pushed_files

    - name: Ensure every pushed directory is world-readable+executable
      # ansible.builtin.copy's directory_mode only applies to directories it
      # creates — it doesn't retroactively fix one that already exists from
      # a previous run under different settings. Verified live: nested
      # grafana/provisioning/* directories were stuck at 0750 from before
      # directory_mode here was 0755, which both (a) made this task report
      # spurious "changed" on every single run regardless of real content
      # changes, and (b) meant Grafana's own non-root container user
      # couldn't even traverse into the directory to read its provisioning
      # file. changed_when: false — this is idempotent normalization, not a
      # signal that real content changed (pushed_files.changed drives that).
      ansible.builtin.command: >-
        find {{ (docker_compose_root ~ '/' ~ stack) | quote }} -type d -exec chmod 0755 {} +
      changed_when: false

    - name: Check for a secrets template for this stack
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../compose/{{ stack }}/.env.j2"
      delegate_to: localhost
      become: false
      register: env_template

    - name: Render stack secrets to .env (read live from secrets.sops.yaml, never committed)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../compose/{{ stack }}/.env.j2"
        dest: "{{ docker_compose_root }}/{{ stack }}/.env"
        mode: "0600"
      when: env_template.stat.exists
      # Deliberately not deleting the raw .env.j2 the earlier copy also
      # pushed alongside this rendered .env — docker compose only reads
      # docker-compose.yml/.env from a project directory, so an unrelated
      # .env.j2 sitting next to it is inert (and it holds no secret, just
      # the template). Verified live: deleting it here just made the next
      # run's directory copy see it "missing" and re-push it — a permanent
      # false "changed" on every single deploy of any stack with a
      # .env.j2, which in turn made this playbook's recreate logic
      # (below) force-recreate the container on every deploy regardless
      # of whether anything real had changed.

    - name: Bring the stack up
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_root }}/{{ stack }}"
        state: present
        # Docker bind-mounts an individual file (not a directory) by inode,
        # not by path. ansible.builtin.copy replaces a changed file via an
        # atomic write-then-rename — a new inode at the same path — so a
        # container whose docker-compose.yml itself didn't change (only a
        # file it bind-mounts, e.g. prometheus.yml/targets.generated.json)
        # silently keeps looking at the old, now-unlinked inode forever.
        # Verified live: this is exactly why monitoring-01's Prometheus
        # never picked up a newly-added server in targets.generated.json
        # until manually restarted. Force recreation only when something
        # was actually pushed this run — not on every deploy regardless.
        recreate: "{{ 'always' if pushed_files.changed else 'auto' }}"
