---
- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication {{ 'yes' if common_ssh_password_auth else 'no' }}"
    validate: /usr/sbin/sshd -T -f %s
  notify: Restart sshd

- name: Compute this host's authorized SSH keys (3-layer union, same pattern as packages)
  ansible.builtin.set_fact:
    ssh_authorized_keys_all_layers: >-
      {{ (common_ssh_authorized_keys | default([]))
         | union(type_ssh_authorized_keys | default([]))
         | union(host_ssh_authorized_keys | default([])) }}

- name: Authorize extra SSH public keys for apj
  ansible.posix.authorized_key:
    user: apj
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys_all_layers }}"

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ 'yes' if common_permit_root_login else 'no' }}"
    validate: /usr/sbin/sshd -T -f %s
  notify: Restart sshd

- name: Ensure unattended-upgrades reboots automatically where allowed
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52-auto-reboot
    content: |
      // Managed by ansible/roles/common — edit common_auto_reboot in
      // group_vars/env_<type>.yml, not this file directly.
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if common_auto_reboot else 'false' }}";
    mode: "0644"
  when: "'unattended-upgrades' in (common_packages | default([]) + type_packages | default([]) + host_packages | default([]))"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Configure firewall (ufw)
  when: common_firewall_enabled | default(false)
  block:
    - name: Compute allowed firewall ports (3-layer union, same pattern as packages)
      ansible.builtin.set_fact:
        firewall_ports_all_layers: >-
          {{ (common_firewall_ports | default([]))
             | union(type_firewall_ports | default([]))
             | union(host_firewall_ports | default([])) }}

    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Set default policy — deny incoming, allow outgoing
      community.general.ufw:
        direction: "{{ item.direction }}"
        default: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow declared ports through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
      loop: "{{ firewall_ports_all_layers }}"

    - name: Enable ufw
      community.general.ufw:
        state: enabled
