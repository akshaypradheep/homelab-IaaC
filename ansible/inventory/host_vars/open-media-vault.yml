# Layer 3 of 3 for compose stack opt-in (see playbooks/deploy-compose.yml):
# extras for this ONE host only, unioned with common_compose_stacks
# (group_vars/all.yml) and type_compose_stacks (group_vars/env_<type>.yml).
# node-exporter comes from common_compose_stacks — nothing extra needed here.
host_compose_stacks: []

# Triggers roles/openmediavault automatically in site.yml — installs OMV
# via its official install script. Idempotent (skips once installed), so
# `make apply` alone is enough; no separate command needed.
install_openmediavault: true

# The two USB drives passed through from Proxmox (attached manually in the
# Proxmox UI — Hardware -> Add -> USB Device — see docs/usb-passthrough.md).
# A non-empty usb_mounts list is also what triggers roles/usb-kernel-fix
# and roles/usb-mounts automatically in site.yml, so `make apply` alone
# gets this host from a fresh clone to drives mounted, no extra commands.
# Mounted by UUID (from `lsblk -f`), not /dev/sdX path.
usb_mounts:
  - name: seagate-one-touch
    uuid: "5EB9-1330"
    fstype: exfat
    path: /mnt/seagate-one-touch
  - name: wd-my-passport
    uuid: "60143C3A143C158E"
    fstype: ntfs
    path: /mnt/wd-my-passport

# Triggers roles/webmin automatically in site.yml.
install_webmin: false
