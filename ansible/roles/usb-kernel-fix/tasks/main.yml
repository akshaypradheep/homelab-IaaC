---
# Debian's linux-image-*-cloud-amd64 kernel flavor ships without USB
# host-controller drivers (xhci_pci, xhci_hcd), so USB passthrough to a
# Proxmox VM silently fails at the guest kernel level even though the host
# and QEMU config are correct. Fix: install the standard kernel, remove
# the cloud kernel packages so GRUB has nothing else to default to, and
# reboot. Idempotent — skips entirely (no reboot) once already on the
# standard kernel, so it's safe to run on every `make apply`.
- name: Check current kernel
  ansible.builtin.command: uname -r
  register: current_kernel
  changed_when: false

- name: Skip hosts already on the standard (non-cloud) kernel
  ansible.builtin.meta: end_role
  when: "'cloud' not in current_kernel.stdout"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the standard (non-cloud) kernel image
  ansible.builtin.apt:
    name: linux-image-amd64
    state: present

- name: Find installed cloud kernel packages
  ansible.builtin.shell: |
    set -o pipefail
    dpkg -l | awk '/^ii/ && /linux-image.*cloud/ {print $2}'
  args:
    executable: /bin/bash
  register: cloud_kernel_pkgs
  changed_when: false

- name: Remove cloud kernel packages (forces GRUB to default to the standard kernel)
  ansible.builtin.apt:
    name: "{{ cloud_kernel_pkgs.stdout_lines }}"
    state: absent
    purge: false
  when: cloud_kernel_pkgs.stdout_lines | length > 0

- name: Regenerate GRUB configuration
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reboot the host to boot into the standard kernel
  ansible.builtin.reboot:
    msg: "Rebooting to switch from cloud kernel to standard kernel for USB passthrough"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 2
    post_reboot_delay: 10
    test_command: uptime

- name: Verify the running kernel is no longer the cloud flavor
  ansible.builtin.command: uname -r
  register: new_kernel
  changed_when: false
  failed_when: "'cloud' in new_kernel.stdout"

- name: Ensure xhci_pci module is loaded
  ansible.builtin.command: modprobe xhci_pci
  changed_when: false

- name: Install usbutils (provides lsusb)
  ansible.builtin.apt:
    name: usbutils
    state: present

- name: Show detected USB devices
  ansible.builtin.command: lsusb
  register: lsusb_out
  changed_when: false
  failed_when: false

- name: Report detected USB devices
  ansible.builtin.debug:
    msg: "{{ lsusb_out.stdout_lines }}"
