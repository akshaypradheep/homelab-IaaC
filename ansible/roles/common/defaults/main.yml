common_ssh_password_auth: false
# UTC, not a specific region — this is the role's fallback for a generic
# boilerplate; group_vars/all.yml already overrides it, but the fallback
# itself should be neutral too.
common_timezone: "UTC"
common_auto_reboot: false
# Same override pattern as common_ssh_password_auth — a single point to
# flip if a future type ever genuinely needs it, defaulting to the hardened
# choice. See roles/common/tasks/main.yml.
common_permit_root_login: false

# Firewall (ufw) — off by default, so adding this repo's firewall support
# doesn't change any existing host's behavior. A type or host opts in by
# setting common_firewall_enabled: true in its own group_vars/env_<type>.yml
# or host_vars/<name>.yml (plain override, same as common_auto_reboot —
# not the packages-style union). Port 22 is always first in the layer-1
# list so enabling the firewall can never lock out SSH.
common_firewall_enabled: false
common_firewall_ports:
  - 22
type_firewall_ports: []
host_firewall_ports: []

# Extra public keys to authorize for the apj user, on top of the one
# Terraform bakes in via cloud-init at VM creation (terraform/modules/server
# — that one is fixed at first boot and never updated by re-applying
# Terraform, so this is also the only way to reach VMs created before a
# key existed). Same 3-layer union pattern as the packages role:
#   common_ssh_authorized_keys <- group_vars/all.yml       (every host)
#   type_ssh_authorized_keys   <- group_vars/env_<type>.yml (one environment,
#                                  e.g. give someone uat-only access)
#   host_ssh_authorized_keys   <- host_vars/<hostname>.yml  (one machine)
# Everyone still logs in as the shared apj account — these lists only
# control which public keys that account will accept, not separate Unix
# users. Like the packages role's union, this is additive only: removing a
# key from YAML and re-provisioning does NOT strip it back out of
# ~/apj/.ssh/authorized_keys on already-provisioned hosts. To actually
# revoke a key, remove the line by hand (or via an ad-hoc
# `ansible.posix.authorized_key ... state=absent`) on every host it was
# pushed to.
common_ssh_authorized_keys: []
type_ssh_authorized_keys: []
host_ssh_authorized_keys: []
