---
# fix-usb-cloud-kernel.yml
#
# Manual entry point for roles/usb-kernel-fix — the same logic runs
# automatically as part of site.yml (and therefore `make apply`) for any
# host with usb_mounts declared in its host_vars, see
# docs/ansible-layout.md. Use this directly when you want to retry just
# the kernel swap without a full site.yml pass.
#
# Disruptive (swaps kernels, reboots the host) — always scoped with
# --limit. See docs/commands.md for how to target one host / several /
# everything.
#
# Usage:
#   make fix-usb-kernel LIMIT=open-media-vault
- name: Fix missing USB (xhci) drivers by switching off the Debian cloud kernel
  hosts: all_servers
  become: true
  roles:
    - usb-kernel-fix
