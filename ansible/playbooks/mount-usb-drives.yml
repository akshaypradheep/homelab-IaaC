---
# mount-usb-drives.yml
#
# Manual entry point for roles/usb-mounts — the same logic runs
# automatically as part of site.yml (and therefore `make apply`) for any
# host with usb_mounts declared in its host_vars, see
# docs/ansible-layout.md for the mount format.
#
# Usage:
#   make ansible-run PLAYBOOK=mount-usb-drives LIMIT=open-media-vault
- name: Mount declared USB drives by UUID
  hosts: all_servers
  become: true
  roles:
    - usb-mounts
