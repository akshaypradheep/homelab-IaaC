---
# install-webmin.yml
#
# Manual entry point for roles/webmin — the same logic runs automatically
# as part of site.yml (and therefore `make apply`) for any host with
# `install_webmin: true` in its host_vars, see docs/ansible-layout.md.
#
# Usage:
#   make ansible-run PLAYBOOK=install-webmin LIMIT=open-media-vault
- name: Install Webmin
  hosts: all_servers
  become: true
  roles:
    - webmin
