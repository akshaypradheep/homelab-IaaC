# Prometheus + Grafana stack — deploy to whichever single host should
# scrape everything else (give that host `compose_stacks: [monitoring]`).
# prometheus.yml's file_sd_config points at targets.generated.json, which
# Terraform rewrites from var.servers on every apply (see
# terraform/main.tf -> local_file.prometheus_targets) — so scrape targets
# stay in sync with the inventory the same way Ansible's does. Grafana
# comes pre-provisioned (see ./grafana/provisioning) with Prometheus as its
# default datasource, so there's no manual click-through after deploy.
#
# Each target expects node_exporter on :9100 — see compose/node-exporter/.
# Every host gets it via `compose_stacks: [node-exporter]` in its
# host_vars, kept separate from this file so "server" and "agent" stacks
# don't get tangled into one abstraction.
#
# GRAFANA_ADMIN_PASSWORD comes from ansible/secrets.sops.yaml via .env.j2 —
# see that file's comment for how deploy-compose.yml renders it.
# Image tags are pinned deliberately — bump them here (and re-verify with
# `docker manifest inspect <image>:<tag>` before rolling out) rather than
# floating on :latest, which makes upgrades unreviewable and unrepeatable.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets.generated.json:/etc/prometheus/targets.generated.json:ro

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Explicit, not just relying on the image default — self-registration
      # would let anyone who can reach :3000 create their own account.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
