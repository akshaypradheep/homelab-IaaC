# Layer 1 of 3 for the packages role (see roles/packages/tasks/main.yml):
# every package listed here installs on every single server, regardless of
# type. Add here only when something truly belongs everywhere.
common_packages:
  - vim
  - curl
  - htop
  - git
  - ca-certificates
  - unzip

# Baseline hardening toggles consumed by roles/common — kept here rather
# than hardcoded in the role so a single override point exists if a future
# type ever needs to opt out (none do today).
common_ssh_password_auth: false
common_timezone: "UTC"

# Promoted from roles/docker/defaults/main.yml (kept there too, as the
# ultimate fallback) so playbooks/deploy-compose.yml can see it — that
# playbook never includes the docker role, so a role default alone isn't
# visible to it. Inventory-level like this, it's still overridable per
# type/host with normal Ansible precedence if you ever need that.
docker_compose_root: /opt/compose

# Layer 1 of 3 for compose stack opt-in (see
# playbooks/deploy-compose.yml) — same 3-layer union pattern as the
# packages role: common_compose_stacks (here) + type_compose_stacks
# (group_vars/env_<type>.yml) + host_compose_stacks (host_vars/<host>.yml).
# node-exporter belongs on every host, so it lives here instead of being
# copy-pasted into every host_vars file.
common_compose_stacks:
  - node-exporter
