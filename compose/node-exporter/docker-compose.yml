# node_exporter — runs on every host that should show up in Prometheus.
# Host network mode so it binds :9100 on the host's real IP directly,
# matching the targets Terraform writes to
# compose/monitoring/targets.generated.json (one <ip>:9100 per server).
# Every host gets this via `common_compose_stacks` in group_vars/all.yml —
# nothing to opt into per-host; see docs/ansible-layout.md for the 3-layer
# union (common/type/host_compose_stacks) if a host ever needs to opt out
# or a type needs something different.
# Image tag pinned deliberately — see compose/monitoring/docker-compose.yml
# for why.
services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.2
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
